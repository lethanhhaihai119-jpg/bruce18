name: Build ESP32 Bin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip code
        run: |
          unzip -o code.zip -d extracted
          find extracted -name "platformio.ini" -exec sed -i 's/ESP-PN532Killer@\^0\.0\.4/ESP-PN532Killer/g' {} +
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Firmware
        run: |
          cd extracted
          if [ -f "platformio.ini" ]; then
            pio run
          else
            SUBDIR=$(find . -maxdepth 2 -name "platformio.ini" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cd "$SUBDIR" && pio run
            else
              INO_FILE=$(find . -name "*.ino" | head -n 1)
              INO_DIR=$(dirname "$INO_FILE")
              pio project init --board esp32doit-devkit-v1 --project-option "framework=arduino"
              cp -r "$INO_DIR"/* src/
              mv src/*.ino src/main.cpp
              pio run
            fi
          fi
      - name: Collect Bin Files
        run: |
          mkdir -p output_bins
          find extracted -name "*.bin" -exec cp {} output_bins/ \;
      - name: Upload Bin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-devkit-v1-bin
          path: output_bins/*.bin
