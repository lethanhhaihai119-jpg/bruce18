name: Build ESP32 Bin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip code
        run: |
          unzip -o code.zip -d extracted
          find extracted -name "platformio.ini" -exec sed -i 's/ESP-PN532Killer@\^0\.0\.4/ESP-PN532Killer/g' {} +
          find extracted -name "led_control.cpp" -exec sed -i 's/const CRGB BrucePurple/constexpr CRGB BrucePurple/g' {} +
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Firmware
        run: |
          cd extracted
          SUBDIR=$(find . -maxdepth 2 -name "platformio.ini" -exec dirname {} \; | head -n 1)
          cd "$SUBDIR"
          pio pkg install -e Marauder-Mini -l "bblanchon/ArduinoJson@^7.0.0"
          pio run -e Marauder-Mini
      - name: Collect Bin Files
        run: |
          mkdir -p output_bins
          find extracted -path "*/.pio/build/Marauder-Mini/*" -name "*.bin" -exec cp {} output_bins/ \;
      - name: Upload Bin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-bruce-1.8inch-bin
          path: output_bins/*.bin
          


